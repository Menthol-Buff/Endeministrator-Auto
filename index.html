<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto-Infinity — 自动化产线</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-green: #3fb950;
    --accent-orange: #d2991d;
    --accent-red: #f85149;
    --accent-purple: #a371f7;
    --grid: #21262d;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-canvas-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans, sans-serif);
    overflow: hidden;
    height: 100vh;
    display: flex;
    user-select: none;
  }

  /* === SIDEBAR === */
  #sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 10;
  }

  #sidebar-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  #sidebar-header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: #fff;
  }

  #sidebar-header .subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
    font-family: var(--font-mono, monospace);
  }

  #toolbox {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }

  .tool-group {
    margin-bottom: 16px;
  }

  .tool-group-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-dim);
    margin-bottom: 8px;
    padding: 0 4px;
  }

  .tool-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid transparent;
  }

  .tool-item:hover { background: #1c2129; }
  .tool-item.active {
    background: #1c2841;
    border-color: var(--accent);
  }

  .tool-icon {
    width: 32px;
    height: 32px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .tool-item[data-node="source"] .tool-icon { background: rgba(88,166,255,0.15); color: var(--accent); }
  .tool-item[data-node="build"]  .tool-icon { background: rgba(163,113,247,0.15); color: var(--accent-purple); }
  .tool-item[data-node="test"]   .tool-icon { background: rgba(63,185,80,0.15); color: var(--accent-green); }
  .tool-item[data-node="deploy"] .tool-icon { background: rgba(210,153,29,0.15); color: var(--accent-orange); }
  .tool-item[data-node="notify"] .tool-icon { background: rgba(248,81,73,0.15); color: var(--accent-red); }

  .tool-name { font-size: 13px; font-weight: 500; }
  .tool-desc { font-size: 11px; color: var(--text-dim); }

  #sidebar-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
  }

  #sidebar-footer .stat-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  #sidebar-footer .stat-value {
    font-family: var(--font-mono, monospace);
    color: var(--text);
  }

  /* === MAIN CANVAS AREA === */
  #main-area {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  canvas {
    display: block;
    cursor: crosshair;
  }

  canvas.grabbing { cursor: grabbing; }

  /* === MINIMAP === */
  #minimap {
    position: absolute;
    bottom: 16px;
    right: 16px;
    width: 180px;
    height: 120px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    opacity: 0.7;
    transition: opacity 0.2s;
  }

  #minimap:hover { opacity: 1; }

  #minimap canvas {
    width: 100%;
    height: 100%;
  }

  /* === TOOLTIP === */
  #tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    display: none;
    z-index: 20;
    white-space: nowrap;
  }

  /* === CONTEXT MENU === */
  #context-menu {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    display: none;
    z-index: 30;
    min-width: 160px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .context-item {
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .context-item:hover { background: #1c2841; }
  .context-sep { height: 1px; background: var(--border); margin: 4px 0; }

  /* === HUD === */
  #hud {
    position: absolute;
    top: 16px;
    left: 16px;
    display: flex;
    gap: 8px;
  }

  .hud-btn {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-family: var(--font-sans, sans-serif);
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: all 0.15s;
  }

  .hud-btn:hover { border-color: var(--text-dim); }
  .hud-btn.accent { border-color: var(--accent); color: var(--accent); }
  .hud-btn.accent:hover { background: rgba(88,166,255,0.1); }

  /* === STATUS BAR === */
  #status-bar {
    position: absolute;
    bottom: 16px;
    left: 16px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--font-mono, monospace);
    display: flex;
    gap: 16px;
  }

  #status-bar span { opacity: 0.7; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>⚙️ Auto-Infinity</h1>
    <div class="subtitle">Automated Pipeline Builder</div>
  </div>

  <div id="toolbox">
    <div class="tool-group">
      <div class="tool-group-label">🏗️ 产线节点</div>
      <div class="tool-item active" data-node="source" data-tool="place">
        <div class="tool-icon">📦</div>
        <div><div class="tool-name">源代码 Source</div><div class="tool-desc">代码仓库入口</div></div>
      </div>
      <div class="tool-item" data-node="build" data-tool="place">
        <div class="tool-icon">🔨</div>
        <div><div class="tool-name">构建 Build</div><div class="tool-desc">编译 &amp; 打包</div></div>
      </div>
      <div class="tool-item" data-node="test" data-tool="place">
        <div class="tool-icon">🧪</div>
        <div><div class="tool-name">测试 Test</div><div class="tool-desc">单元 &amp; 集成测试</div></div>
      </div>
      <div class="tool-item" data-node="deploy" data-tool="place">
        <div class="tool-icon">🚀</div>
        <div><div class="tool-name">部署 Deploy</div><div class="tool-desc">发布到目标环境</div></div>
      </div>
      <div class="tool-item" data-node="notify" data-tool="place">
        <div class="tool-icon">🔔</div>
        <div><div class="tool-name">通知 Notify</div><div class="tool-desc">发送构建报告</div></div>
      </div>
    </div>

    <div class="tool-group">
      <div class="tool-group-label">🔧 工具</div>
      <div class="tool-item" data-tool="connect" id="tool-connect">
        <div class="tool-icon" style="background:rgba(255,255,255,0.08);">🔗</div>
        <div><div class="tool-name">连线 Connect</div><div class="tool-desc">连接节点形成流水线</div></div>
      </div>
      <div class="tool-item" data-tool="delete" id="tool-delete">
        <div class="tool-icon" style="background:rgba(248,81,73,0.1);">🗑️</div>
        <div><div class="tool-name">删除 Delete</div><div class="tool-desc">删除节点或连线</div></div>
      </div>
      <div class="tool-item" data-tool="pan" id="tool-pan">
        <div class="tool-icon" style="background:rgba(255,255,255,0.08);">✋</div>
        <div><div class="tool-name">平移 Pan</div><div class="tool-desc">拖拽移动画布</div></div>
      </div>
    </div>
  </div>

  <div id="sidebar-footer">
    <div class="stat-row"><span>节点数</span><span class="stat-value" id="stat-nodes">0</span></div>
    <div class="stat-row"><span>连线数</span><span class="stat-value" id="stat-edges">0</span></div>
    <div class="stat-row"><span>FPS</span><span class="stat-value" id="stat-fps">60</span></div>
  </div>
</div>

<!-- MAIN AREA -->
<div id="main-area">
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <button class="hud-btn" id="btn-fit" title="适应画布">⊞ 重置视图</button>
    <button class="hud-btn" id="btn-run" title="运行流水线">▶ 运行</button>
    <button class="hud-btn" id="btn-clear" title="清空画布">✕ 清空</button>
  </div>

  <div id="minimap"><canvas id="minimap-canvas"></canvas></div>

  <div id="tooltip"></div>

  <div id="context-menu">
    <div class="context-item" data-action="delete">🗑️ 删除节点</div>
    <div class="context-item" data-action="duplicate">📋 复制节点</div>
    <div class="context-sep"></div>
    <div class="context-item" data-action="properties">⚙️ 属性...</div>
  </div>

  <div id="status-bar">
    <span id="status-tool">工具: 放置节点 (Source)</span>
    <span id="status-pos">0, 0</span>
    <span id="status-zoom">100%</span>
  </div>
</div>

<script>
// ============================================================
// Auto-Infinity — 自动化产线游戏引擎
// ============================================================

const CONFIG = {
  GRID_SIZE: 32,
  MIN_ZOOM: 0.15,
  MAX_ZOOM: 2.5,
  ZOOM_SENSITIVITY: 0.001,
  NODE_RADIUS: 24,
  EDGE_WIDTH: 2.5,
  PARTICLE_SPEED: 80,       // px/s along edges
  PARTICLE_INTERVAL: 800,   // ms between particle spawns
  ANIM_DURATION: 300,
};

// ---- Cached font (CSS variables don't work in canvas) ----
const FONT_MONO = getComputedStyle(document.documentElement)
  .getPropertyValue('--font-canvas-mono').trim();

// ---- Node type definitions ----
const NODE_TYPES = {
  source: { label: 'Source', icon: '📦', color: '#58a6ff', category: 'entry' },
  build:  { label: 'Build',  icon: '🔨', color: '#a371f7', category: 'process' },
  test:   { label: 'Test',   icon: '🧪', color: '#3fb950', category: 'process' },
  deploy: { label: 'Deploy', icon: '🚀', color: '#d2991d', category: 'process' },
  notify: { label: 'Notify', icon: '🔔', color: '#f85149', category: 'output' },
};

// ---- App State ----
const state = {
  nodes: [],             // { id, type, x, y, label }
  edges: [],             // { id, from, to }
  particles: [],         // { edgeId, progress, speed }

  // View
  camera: { x: 0, y: 0, zoom: 1 },

  // Interaction
  tool: 'place',         // 'place' | 'connect' | 'delete' | 'pan'
  placeNodeType: 'source',
  hoveredNode: null,
  selectedNode: null,
  connectingFrom: null,  // node id being connected FROM
  connectingLine: null,  // { x1, y1, x2, y2 } temp line
  dragging: null,        // { type:'node'|'pan', id?, sx?, sy?, ox?, oy? }
  contextTarget: null,

  // Stats
  nodeCounter: 0,
  edgeCounter: 0,
  fps: 60,
  running: false,
};

// ---- DOM refs ----
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap-canvas');
const minimapCtx = minimapCanvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const contextMenu = document.getElementById('context-menu');
const mainArea = document.getElementById('main-area');

// ---- Resize ----
function resize() {
  const rect = mainArea.getBoundingClientRect();
  canvas.width = rect.width * devicePixelRatio;
  canvas.height = rect.height * devicePixelRatio;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---- Coordinate helpers ----
function screenToWorld(sx, sy) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (sx - rect.width / 2) / state.camera.zoom + state.camera.x,
    y: (sy - rect.height / 2) / state.camera.zoom + state.camera.y,
  };
}

function worldToScreen(wx, wy) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (wx - state.camera.x) * state.camera.zoom + rect.width / 2,
    y: (wy - state.camera.y) * state.camera.zoom + rect.height / 2,
  };
}

function snapToGrid(val) {
  return Math.round(val / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;
}

// ---- Node / Edge CRUD ----
function addNode(type, x, y) {
  const def = NODE_TYPES[type];
  const id = `n_${++state.nodeCounter}`;
  state.nodes.push({ id, type, x: snapToGrid(x), y: snapToGrid(y), label: def.label });
  updateStats();
  return id;
}

function removeNode(id) {
  state.nodes = state.nodes.filter(n => n.id !== id);
  state.edges = state.edges.filter(e => e.from !== id && e.to !== id);
  state.particles = state.particles.filter(p => {
    const edge = state.edges.find(e => e.id === p.edgeId);
    return !!edge;
  });
  updateStats();
}

function addEdge(fromId, toId) {
  const exists = state.edges.some(e =>
    (e.from === fromId && e.to === toId) || (e.from === toId && e.to === fromId)
  );
  if (exists || fromId === toId) return null;
  const id = `e_${++state.edgeCounter}`;
  state.edges.push({ id, from: fromId, to: toId });
  updateStats();
  return id;
}

function removeEdge(id) {
  state.edges = state.edges.filter(e => e.id !== id);
  state.particles = state.particles.filter(p => p.edgeId !== id);
  updateStats();
}

function findNodeAt(wx, wy) {
  const r = CONFIG.NODE_RADIUS / state.camera.zoom;
  for (let i = state.nodes.length - 1; i >= 0; i--) {
    const n = state.nodes[i];
    const dx = n.x - wx, dy = n.y - wy;
    if (Math.hypot(dx, dy) < r + 4) return n;
  }
  return null;
}

function findEdgeAt(wx, wy) {
  const threshold = 8 / state.camera.zoom;
  for (const edge of state.edges) {
    const fn = state.nodes.find(n => n.id === edge.from);
    const tn = state.nodes.find(n => n.id === edge.to);
    if (!fn || !tn) continue;
    const dist = pointToSegmentDist(wx, wy, fn.x, fn.y, tn.x, tn.y);
    if (dist < threshold) return edge;
  }
  return null;
}

function pointToSegmentDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - ax, py - ay);
  let t = ((px - ax) * dx + (py - ay) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

function updateStats() {
  document.getElementById('stat-nodes').textContent = state.nodes.length;
  document.getElementById('stat-edges').textContent = state.edges.length;
}

// ---- Drawing ----
function drawGrid() {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  const gs = CONFIG.GRID_SIZE * state.camera.zoom;

  // Only draw if grid is visible enough
  if (gs < 8) return;

  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 1;

  const offsetX = (state.camera.x * state.camera.zoom) % gs;
  const offsetY = (state.camera.y * state.camera.zoom) % gs;

  ctx.beginPath();
  for (let x = -offsetX; x <= w; x += gs) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
  }
  for (let y = -offsetY; y <= h; y += gs) {
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
  }
  ctx.stroke();
}

function drawEdges() {
  for (const edge of state.edges) {
    const fn = state.nodes.find(n => n.id === edge.from);
    const tn = state.nodes.find(n => n.id === edge.to);
    if (!fn || !tn) continue;

    const fs = worldToScreen(fn.x, fn.y);
    const ts = worldToScreen(tn.x, tn.y);

    // Directional offset away from node center
    const angle = Math.atan2(ts.y - fs.y, ts.x - fs.x);
    const r = CONFIG.NODE_RADIUS * state.camera.zoom;
    const sx = fs.x + Math.cos(angle) * r;
    const sy = fs.y + Math.sin(angle) * r;
    const ex = ts.x - Math.cos(angle) * r;
    const ey = ts.y - Math.sin(angle) * r;

    ctx.strokeStyle = '#30363d';
    ctx.lineWidth = CONFIG.EDGE_WIDTH * state.camera.zoom;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();

    // Arrowhead
    const arrowSize = 8 * state.camera.zoom;
    const arrowAngle = Math.PI / 6;
    ctx.fillStyle = '#484f58';
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(
      ex - arrowSize * Math.cos(angle - arrowAngle),
      ey - arrowSize * Math.sin(angle - arrowAngle)
    );
    ctx.lineTo(
      ex - arrowSize * Math.cos(angle + arrowAngle),
      ey - arrowSize * Math.sin(angle + arrowAngle)
    );
    ctx.closePath();
    ctx.fill();
  }
}

function drawConnectingLine() {
  if (!state.connectingLine) return;
  const { x1, y1, x2, y2 } = state.connectingLine;
  const s = worldToScreen(x1, y1);
  const e = worldToScreen(x2, y2);

  ctx.strokeStyle = '#58a6ff';
  ctx.lineWidth = 2 * state.camera.zoom;
  ctx.setLineDash([6 * state.camera.zoom, 4 * state.camera.zoom]);
  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.moveTo(s.x, s.y);
  ctx.lineTo(e.x, e.y);
  ctx.stroke();

  ctx.setLineDash([]);
}

function drawNode(n) {
  const s = worldToScreen(n.x, n.y);
  const r = CONFIG.NODE_RADIUS * state.camera.zoom;
  const def = NODE_TYPES[n.type];
  const isHovered = state.hoveredNode?.id === n.id;
  const isSelected = state.selectedNode?.id === n.id;
  const isConnectSource = state.connectingFrom === n.id;

  // Glow when hovered / selected
  if (isHovered || isSelected || isConnectSource) {
    ctx.fillStyle = def.color + '18';
    ctx.beginPath();
    ctx.arc(s.x, s.y, r + 8 * state.camera.zoom, 0, Math.PI * 2);
    ctx.fill();
  }

  // Selection ring
  if (isSelected) {
    ctx.strokeStyle = def.color;
    ctx.lineWidth = 2.5 * state.camera.zoom;
    ctx.setLineDash([4 * state.camera.zoom, 3 * state.camera.zoom]);
    ctx.beginPath();
    ctx.arc(s.x, s.y, r + 3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Node body
  const grad = ctx.createRadialGradient(s.x, s.y, r * 0.1, s.x, s.y, r);
  grad.addColorStop(0, '#21262d');
  grad.addColorStop(1, '#161b22');

  ctx.fillStyle = grad;
  ctx.strokeStyle = isHovered ? def.color : '#30363d';
  ctx.lineWidth = (isHovered ? 2 : 1.5) * state.camera.zoom;
  ctx.beginPath();
  ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Icon
  ctx.font = `${16 * state.camera.zoom}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(def.icon, s.x, s.y - 4 * state.camera.zoom);

  // Label
  ctx.fillStyle = isHovered ? '#fff' : '#c9d1d9';
  ctx.font = `${11 * state.camera.zoom}px ${FONT_MONO}`;
  ctx.fillText(n.label, s.x, s.y + r + 13 * state.camera.zoom);

  // Connect indicator (small dot)
  if (isConnectSource) {
    ctx.fillStyle = '#58a6ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, 4 * state.camera.zoom, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawParticles() {
  for (const p of state.particles) {
    const edge = state.edges.find(e => e.id === p.edgeId);
    if (!edge) continue;

    const fn = state.nodes.find(n => n.id === edge.from);
    const tn = state.nodes.find(n => n.id === edge.to);
    if (!fn || !tn) continue;

    const x = fn.x + (tn.x - fn.x) * p.progress;
    const y = fn.y + (tn.y - fn.y) * p.progress;
    const s = worldToScreen(x, y);
    const r = 2.5 * state.camera.zoom;

    ctx.fillStyle = '#58a6ff';
    ctx.shadowColor = '#58a6ff';
    ctx.shadowBlur = 6 * state.camera.zoom;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function draw() {
  const rect = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, rect.height);

  // Background
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, rect.width, rect.height);

  drawGrid();
  drawEdges();
  drawConnectingLine();

  for (const node of state.nodes) {
    drawNode(node);
  }

  drawParticles();
}

function drawMinimap() {
  const mw = minimapCanvas.width;
  const mh = minimapCanvas.height;

  minimapCtx.clearRect(0, 0, mw, mh);
  minimapCtx.fillStyle = '#0d1117';
  minimapCtx.fillRect(0, 0, mw, mh);

  if (state.nodes.length === 0) return;

  // Compute bounds
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of state.nodes) {
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x); maxY = Math.max(maxY, n.y);
  }

  const pad = 100;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;

  const scaleX = mw / (maxX - minX);
  const scaleY = mh / (maxY - minY);
  const scale = Math.min(scaleX, scaleY);

  const offsetX = (mw - (maxX - minX) * scale) / 2 - minX * scale;
  const offsetY = (mh - (maxY - minY) * scale) / 2 - minY * scale;

  // Draw edges
  minimapCtx.strokeStyle = '#30363d';
  minimapCtx.lineWidth = 1;
  for (const edge of state.edges) {
    const fn = state.nodes.find(n => n.id === edge.from);
    const tn = state.nodes.find(n => n.id === edge.to);
    if (!fn || !tn) continue;
    minimapCtx.beginPath();
    minimapCtx.moveTo(fn.x * scale + offsetX, fn.y * scale + offsetY);
    minimapCtx.lineTo(tn.x * scale + offsetX, tn.y * scale + offsetY);
    minimapCtx.stroke();
  }

  // Draw nodes
  for (const n of state.nodes) {
    const def = NODE_TYPES[n.type];
    minimapCtx.fillStyle = def.color;
    minimapCtx.beginPath();
    minimapCtx.arc(n.x * scale + offsetX, n.y * scale + offsetY, 3, 0, Math.PI * 2);
    minimapCtx.fill();
  }
}

// ---- Game Loop ----
let lastTime = performance.now();
let lastParticleSpawn = 0;
let fpsAccum = 0;
let fpsFrames = 0;

function update(dt) {
  // Update particles
  for (const p of state.particles) {
    const edge = state.edges.find(e => e.id === p.edgeId);
    if (!edge) continue;
    const fn = state.nodes.find(n => n.id === edge.from);
    const tn = state.nodes.find(n => n.id === edge.to);
    if (!fn || !tn) continue;

    const dist = Math.hypot(tn.x - fn.x, tn.y - fn.y);
    p.progress += (p.speed * dt) / dist;
  }

  // Remove finished particles
  state.particles = state.particles.filter(p => p.progress < 1);

  // Spawn new particles when running
  if (state.running) {
    const now = performance.now();
    if (now - lastParticleSpawn > CONFIG.PARTICLE_INTERVAL) {
      lastParticleSpawn = now;
      // Spawn at all source nodes
      for (const node of state.nodes) {
        if (NODE_TYPES[node.type].category === 'entry') {
          const outgoing = state.edges.filter(e => e.from === node.id);
          for (const edge of outgoing) {
            state.particles.push({
              edgeId: edge.id,
              progress: 0,
              speed: CONFIG.PARTICLE_SPEED + Math.random() * 40,
            });
          }
        }
      }
    }
  }
}

function gameLoop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.1);
  lastTime = time;

  // FPS
  fpsAccum += dt;
  fpsFrames++;
  if (fpsAccum >= 1) {
    state.fps = fpsFrames;
    document.getElementById('stat-fps').textContent = fpsFrames;
    document.getElementById('status-zoom').textContent = Math.round(state.camera.zoom * 100) + '%';
    fpsAccum = 0;
    fpsFrames = 0;
  }

  update(dt);
  draw();

  // Minimap (throttled)
  if (fpsFrames === 0) {
    drawMinimap();
  }

  requestAnimationFrame(gameLoop);
}

// ---- Event Handlers ----
function getEventPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('mousedown', (e) => {
  const pos = getEventPos(e);
  const world = screenToWorld(pos.x, pos.y);
  const node = findNodeAt(world.x, world.y);

  // Right click → context menu
  if (e.button === 2) {
    e.preventDefault();
    if (node) {
      state.contextTarget = node;
      state.selectedNode = node;
      contextMenu.style.display = 'block';
      contextMenu.style.left = (e.clientX - mainArea.getBoundingClientRect().left) + 'px';
      contextMenu.style.top = (e.clientY - mainArea.getBoundingClientRect().top) + 'px';
    }
    return;
  }

  if (e.button !== 0) return;

  // Left click
  switch (state.tool) {
    case 'place':
      if (node) {
        // Start dragging existing node
        state.dragging = { type: 'node', id: node.id, ox: node.x, oy: node.y };
        state.selectedNode = node;
      } else {
        // Place new node
        const id = addNode(state.placeNodeType, world.x, world.y);
        state.selectedNode = state.nodes.find(n => n.id === id);
      }
      break;

    case 'connect':
      if (node) {
        state.connectingFrom = node.id;
        state.connectingLine = { x1: node.x, y1: node.y, x2: world.x, y2: world.y };
      } else {
        const edge = findEdgeAt(world.x, world.y);
        if (edge) removeEdge(edge.id);
      }
      break;

    case 'delete':
      if (node) {
        removeNode(node.id);
        state.selectedNode = null;
      } else {
        const edge = findEdgeAt(world.x, world.y);
        if (edge) removeEdge(edge.id);
      }
      break;

    case 'pan':
      state.dragging = { type: 'pan', sx: e.clientX, sy: e.clientY, ox: state.camera.x, oy: state.camera.y };
      canvas.classList.add('grabbing');
      break;
  }
});

canvas.addEventListener('mousemove', (e) => {
  const pos = getEventPos(e);
  const world = screenToWorld(pos.x, pos.y);

  // Update status bar
  document.getElementById('status-pos').textContent =
    `${Math.round(world.x)}, ${Math.round(world.y)}`;

  // Tooltip
  const node = findNodeAt(world.x, world.y);
  if (node && state.tool !== 'pan' && !state.dragging) {
    state.hoveredNode = node;
    tooltip.style.display = 'block';
    tooltip.style.left = (pos.x + 16) + 'px';
    tooltip.style.top = (pos.y - 8) + 'px';
    tooltip.textContent = `${NODE_TYPES[node.type].icon} ${node.label} (${node.id})`;
    canvas.style.cursor = state.tool === 'delete' ? 'pointer' : 'grab';
  } else {
    state.hoveredNode = null;
    tooltip.style.display = 'none';
    if (state.tool === 'pan') canvas.style.cursor = 'grab';
    else if (state.tool === 'delete') canvas.style.cursor = 'crosshair';
    else if (state.tool === 'connect') canvas.style.cursor = 'crosshair';
    else canvas.style.cursor = 'crosshair';
  }

  // Dragging
  if (state.dragging) {
    if (state.dragging.type === 'node') {
      const n = state.nodes.find(n => n.id === state.dragging.id);
      if (n) {
        n.x = snapToGrid(world.x);
        n.y = snapToGrid(world.y);
      }
    } else if (state.dragging.type === 'pan') {
      state.camera.x = state.dragging.ox - (e.clientX - state.dragging.sx) / state.camera.zoom;
      state.camera.y = state.dragging.oy - (e.clientY - state.dragging.sy) / state.camera.zoom;
    }
  }

  // Connecting line
  if (state.connectingFrom) {
    state.connectingLine = {
      x1: state.nodes.find(n => n.id === state.connectingFrom)?.x ?? 0,
      y1: state.nodes.find(n => n.id === state.connectingFrom)?.y ?? 0,
      x2: world.x,
      y2: world.y,
    };
  }
});

canvas.addEventListener('mouseup', (e) => {
  const pos = getEventPos(e);
  const world = screenToWorld(pos.x, pos.y);

  // Finish connecting
  if (state.connectingFrom) {
    const targetNode = findNodeAt(world.x, world.y);
    if (targetNode && targetNode.id !== state.connectingFrom) {
      addEdge(state.connectingFrom, targetNode.id);
    }
    state.connectingFrom = null;
    state.connectingLine = null;
  }

  // Finish dragging node
  if (state.dragging?.type === 'node') {
    state.dragging = null;
  }

  // Finish pan
  if (state.dragging?.type === 'pan') {
    state.dragging = null;
    canvas.classList.remove('grabbing');
  }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = -e.deltaY * CONFIG.ZOOM_SENSITIVITY;
  const newZoom = Math.max(CONFIG.MIN_ZOOM, Math.min(CONFIG.MAX_ZOOM, state.camera.zoom * (1 + delta)));

  // Zoom toward cursor
  const pos = getEventPos(e);
  const worldBefore = screenToWorld(pos.x, pos.y);

  state.camera.zoom = newZoom;

  const worldAfter = screenToWorld(pos.x, pos.y);
  state.camera.x += worldBefore.x - worldAfter.x;
  state.camera.y += worldBefore.y - worldAfter.y;
}, { passive: false });

canvas.addEventListener('contextmenu', e => e.preventDefault());

// ---- Click outside closes context menu ----
document.addEventListener('click', (e) => {
  if (e.target !== canvas && !contextMenu.contains(e.target)) {
    contextMenu.style.display = 'none';
    state.contextTarget = null;
  }
});

// ---- Context menu actions ----
contextMenu.addEventListener('click', (e) => {
  const action = e.target.closest('.context-item')?.dataset.action;
  if (!action) return;

  const node = state.contextTarget;
  if (!node) return;

  switch (action) {
    case 'delete':
      removeNode(node.id);
      break;
    case 'duplicate':
      addNode(node.type, node.x + CONFIG.GRID_SIZE * 2, node.y + CONFIG.GRID_SIZE * 2);
      break;
    case 'properties':
      // Placeholder for future property editor
      break;
  }

  contextMenu.style.display = 'none';
  state.contextTarget = null;
});

// ---- Toolbox ----
document.querySelectorAll('.tool-item[data-tool]').forEach(item => {
  item.addEventListener('click', () => {
    // Update active state
    document.querySelectorAll('.tool-item[data-tool]').forEach(el => el.classList.remove('active'));

    const tool = item.dataset.tool;
    const nodeType = item.dataset.node;

    if (tool === 'place' && nodeType) {
      state.tool = 'place';
      state.placeNodeType = nodeType;
      item.classList.add('active');
      document.getElementById('status-tool').textContent = `工具: 放置节点 (${NODE_TYPES[nodeType].label})`;
    } else if (tool === 'connect') {
      state.tool = 'connect';
      document.getElementById('tool-connect').classList.add('active');
      document.getElementById('status-tool').textContent = '工具: 连线模式';
    } else if (tool === 'delete') {
      state.tool = 'delete';
      document.getElementById('tool-delete').classList.add('active');
      document.getElementById('status-tool').textContent = '工具: 删除模式';
    } else if (tool === 'pan') {
      state.tool = 'pan';
      document.getElementById('tool-pan').classList.add('active');
      document.getElementById('status-tool').textContent = '工具: 平移画布';
    }

    state.connectingFrom = null;
    state.connectingLine = null;
  });
});

// ---- Keyboard shortcuts ----
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  switch (e.key) {
    case '1': case '2': case '3': case '4': case '5':
      const types = Object.keys(NODE_TYPES);
      const idx = parseInt(e.key) - 1;
      if (idx < types.length) {
        state.tool = 'place';
        state.placeNodeType = types[idx];
        document.querySelectorAll('.tool-item[data-tool]').forEach(el => el.classList.remove('active'));
        const item = document.querySelector(`.tool-item[data-node="${types[idx]}"]`);
        if (item) item.classList.add('active');
        document.getElementById('status-tool').textContent =
          `工具: 放置节点 (${NODE_TYPES[types[idx]].label})`;
      }
      break;
    case 'c':
      state.tool = 'connect';
      document.querySelectorAll('.tool-item[data-tool]').forEach(el => el.classList.remove('active'));
      document.getElementById('tool-connect').classList.add('active');
      document.getElementById('status-tool').textContent = '工具: 连线模式';
      break;
    case 'd':
      state.tool = 'delete';
      document.querySelectorAll('.tool-item[data-tool]').forEach(el => el.classList.remove('active'));
      document.getElementById('tool-delete').classList.add('active');
      document.getElementById('status-tool').textContent = '工具: 删除模式';
      break;
    case 'h':
      state.tool = 'pan';
      document.querySelectorAll('.tool-item[data-tool]').forEach(el => el.classList.remove('active'));
      document.getElementById('tool-pan').classList.add('active');
      document.getElementById('status-tool').textContent = '工具: 平移画布';
      break;
    case 'Delete':
    case 'Backspace':
      if (state.selectedNode) {
        removeNode(state.selectedNode.id);
        state.selectedNode = null;
      }
      break;
    case 'Escape':
      state.connectingFrom = null;
      state.connectingLine = null;
      state.selectedNode = null;
      break;
    case 'f':
      // Fit all nodes in view
      fitView();
      break;
  }
});

// ---- HUD buttons ----
document.getElementById('btn-fit').addEventListener('click', fitView);

document.getElementById('btn-run').addEventListener('click', () => {
  state.running = !state.running;
  const btn = document.getElementById('btn-run');
  if (state.running) {
    btn.textContent = '⏸ 停止';
    btn.classList.add('accent');
    lastParticleSpawn = 0;
  } else {
    btn.textContent = '▶ 运行';
    btn.classList.remove('accent');
    state.particles = [];
  }
});

document.getElementById('btn-clear').addEventListener('click', () => {
  if (state.nodes.length === 0) return;
  if (confirm('确定要清空画布上的所有节点和连线吗？')) {
    state.nodes = [];
    state.edges = [];
    state.particles = [];
    state.selectedNode = null;
    state.connectingFrom = null;
    state.connectingLine = null;
    updateStats();
  }
});

// ---- Minimap resize ----
function resizeMinimap() {
  const el = document.getElementById('minimap');
  const w = el.clientWidth * devicePixelRatio;
  const h = el.clientHeight * devicePixelRatio;
  minimapCanvas.width = w;
  minimapCanvas.height = h;
}
window.addEventListener('resize', resizeMinimap);
resizeMinimap();

// ---- Fit view ----
function fitView() {
  if (state.nodes.length === 0) {
    state.camera = { x: 0, y: 0, zoom: 1 };
    return;
  }

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of state.nodes) {
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x); maxY = Math.max(maxY, n.y);
  }

  const pad = 120;
  const rect = canvas.getBoundingClientRect();
  const scaleX = rect.width / (maxX - minX + pad * 2);
  const scaleY = rect.height / (maxY - minY + pad * 2);
  const zoom = Math.min(scaleX, scaleY, CONFIG.MAX_ZOOM);

  state.camera = {
    x: (minX + maxX) / 2,
    y: (minY + maxY) / 2,
    zoom: Math.max(zoom, CONFIG.MIN_ZOOM),
  };
}

// ---- Touch support ----
let lastTouchDist = 0;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const delta = (dist / lastTouchDist) - 1;
    state.camera.zoom = Math.max(CONFIG.MIN_ZOOM, Math.min(CONFIG.MAX_ZOOM, state.camera.zoom * (1 + delta)));
    lastTouchDist = dist;
  }
}, { passive: true });

// ---- Bootstrap with demo pipeline ----
function createDemo() {
  const gapX = 6 * CONFIG.GRID_SIZE;
  const gapY = 5 * CONFIG.GRID_SIZE;
  const baseY = 0;

  // Row 1: Standard CI pipeline
  const src1 = addNode('source', -gapX * 2, baseY);
  const bld1 = addNode('build',  -gapX, baseY);
  const tst1 = addNode('test',   0,     baseY);
  const dep1 = addNode('deploy', +gapX, baseY);
  const ntf1 = addNode('notify', +gapX * 2, baseY);
  addEdge(src1, bld1);
  addEdge(bld1, tst1);
  addEdge(tst1, dep1);
  addEdge(dep1, ntf1);

  // Row 2: Branch pipeline
  const src2 = addNode('source', -gapX * 2, baseY - gapY);
  const bld2 = addNode('build',  -gapX, baseY - gapY);
  const tst2a = addNode('test',   0,     baseY - gapY - CONFIG.GRID_SIZE);
  const tst2b = addNode('test',   +gapX, baseY - gapY - CONFIG.GRID_SIZE);
  const dep2 = addNode('deploy', +gapX * 2, baseY - gapY);
  addEdge(src2, bld2);
  addEdge(bld2, tst2a);
  addEdge(bld2, tst2b);
  addEdge(tst2a, dep2);
  addEdge(tst2b, dep2);

  fitView();
}

// ---- Start ----
resize();
createDemo();
requestAnimationFrame(gameLoop);
</script>
